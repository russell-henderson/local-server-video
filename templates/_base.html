<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Local Video Server{% endblock %}</title>
    
    <!-- Bootstrap CSS (keep for grid system and utilities) -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    
    <!-- Google Fonts -->
    <link href="{{ url_for('static', filename='vendor/roboto/roboto.css') }}" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('favicon') }}">
    
    <!-- Consolidated Application Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/playlists.css') }}">
    
    {% block extra_head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body>
    <!-- Navigation -->
    {% include '_navbar.html' %}
    
    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Modals -->
    {% include 'partials/playlist_modal.html' %}
    
    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}" defer></script>
    
    <!-- Video Player JS -->
    <script src="{{ url_for('static', filename='js/player.js') }}" defer></script>
    <!-- Ratings (delegated) -->
    <script src="{{ url_for('static', filename='js/ratings.js') }}" defer></script>
    <!-- Favorites helper (compat) -->
    <script src="{{ url_for('static', filename='favorites.js') }}" defer></script>
    <!-- Tags handling -->
    <script src="{{ url_for('static', filename='js/tags.js') }}" defer></script>
    <!-- Playlists controller -->
    <script src="{{ url_for('static', filename='js/playlists.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/playlist-rating.js') }}" defer></script>
    
    <!-- Retire only this app's legacy worker and caches. LAN serving needs no SW. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(
            registrations.filter(registration => {
              const worker = registration.active || registration.waiting || registration.installing;
              return worker && new URL(worker.scriptURL).pathname === '/static/sw.js';
            }).map(registration => registration.unregister())
          )).then(async () => {
            if ('caches' in window) {
              for (const name of ['local-video-server-v1', 'local-video-server-v2']) await caches.delete(name);
            }
          }).catch(() => { /* Storage may be blocked; normal HTTP still works. */ });
        });
      }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
